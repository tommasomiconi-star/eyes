<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eyes — VHS Horror Webcam</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}
#container {
  position: relative;
  width: 100vw;
  height: 100vh;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}
video {
  display: none;
}
#overlay {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10;
}
#startBtn {
  background: #111;
  color: #888;
  border: 1px solid #333;
  padding: 12px 32px;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  cursor: pointer;
  letter-spacing: 2px;
  text-transform: uppercase;
}
#startBtn:hover {
  background: #1a1a1a;
  color: #aaa;
  border-color: #555;
}
#status {
  color: #444;
  font-size: 11px;
  letter-spacing: 3px;
  margin-top: 8px;
  text-transform: uppercase;
}
</style>
</head>
<body>
<div id="container">
  <canvas id="mainCanvas"></canvas>
  <video id="video" autoplay playsinline></video>
  <div id="overlay">
    <button id="startBtn">▶ attiva webcam</button>
    <div id="status">SURVEILLANCE FEED // SIGNAL UNSTABLE</div>
  </div>
</div>
<script>
const video = document.getElementById('video');

const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const statusEl = document.getElementById('status');

let offCanvas = document.createElement('canvas');
let offCtx = offCanvas.getContext('2d');

function sizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', sizeCanvas);
sizeCanvas();

async function startWebcam() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    video.srcObject = stream;
    await video.play();
    startBtn.style.display = 'none';
    statusEl.textContent = 'SURVEILLANCE FEED // SIGNAL UNSTABLE';
    loop();
  } catch (err) {
    statusEl.textContent = 'ERRORE WEBCAM // ' + err.message;
  }
}

startBtn.addEventListener('click', startWebcam);

function macroblockRow(data, cw, ch) {
  const mbH = 4 + Math.floor(Math.random() * 8);
  const mbY = Math.floor(Math.random() * (ch - mbH));
  const mbW = Math.floor(Math.random() * (cw / 2)) + 20;
  const mbX = Math.floor(Math.random() * (cw - mbW));
  const srcY = Math.floor(Math.random() * (ch - mbH));
  for (let y = 0; y < mbH; y++) {
    const sy = (srcY + y) * cw * 4;
    const dy = (mbY + y) * cw * 4;
    for (let x = 0; x < mbW; x++) {
      const si = sy + (mbX + x) * 4;
      const di = dy + (mbX + x) * 4;
      data[di] = data[si];
      data[di + 1] = data[si + 1];
      data[di + 2] = data[si + 2];
    }
  }
}

function renderFrame() {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (vw === 0 || vh === 0) return;

  const cw = canvas.width;
  const ch = canvas.height;

  offCanvas.width = vw;
  offCanvas.height = vh;
  offCtx.drawImage(video, 0, 0, vw, vh);
  const imageData = offCtx.getImageData(0, 0, vw, vh);
  const data = imageData.data;

  // B&W decomposition effect
  const tileW = 4;
  const tileH = 4;
  const contrastNorm = 1.5;
  const decompose = 0.3;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cw, ch);

  for (let ty = 0; ty < ch; ty += tileH) {
    for (let tx = 0; tx < cw; tx += tileW) {
      if (Math.random() < decompose) continue;

      const driftX = Math.floor((Math.random() - 0.5) * tileW * 2);
      const driftY = Math.floor((Math.random() - 0.5) * tileH * 2);

      const sx = Math.max(0, Math.min(vw - 1, Math.floor(((tx + driftX) / cw) * vw)));
      const sy = Math.max(0, Math.min(vh - 1, Math.floor(((ty + driftY) / ch) * vh)));
      const idx = (sy * vw + sx) * 4;
      const r = data[idx] || 0;
      const g = data[idx + 1] || 0;
      const b = data[idx + 2] || 0;

      let gray = 0.299 * r + 0.587 * g + 0.114 * b;
      gray = Math.round((gray - 128) * contrastNorm + 128);
      gray = Math.min(255, Math.max(0, gray));
      gray = gray > 128 ? 0 : 255;

      ctx.fillStyle = `rgb(${gray},${gray},${gray})`;
      ctx.fillRect(tx, ty, tileW, tileH);
    }
  }

  if (Math.random() < 0.12) macroblockRow(ctx.getImageData(0, 0, cw, ch).data, cw, ch);

  // CRT bulge post-FX
  const postData = ctx.getImageData(0, 0, cw, ch);
  const src = new Uint8ClampedArray(postData.data);
  const d = postData.data;
  const bulgeLUT = new Uint16Array(cw);
  for (let x = 0; x < cw; x++) {
    const nx = (x / cw) * 2 - 1;
    const distortion = 1 + 0.12 * nx * nx;
    bulgeLUT[x] = Math.max(0, Math.min(cw - 1, Math.floor((x - cw / 2) * distortion + cw / 2)));
  }
  for (let y = 0; y < ch; y++) {
    const row = y * cw;
    for (let x = 0; x < cw; x++) {
      const si = (row + bulgeLUT[x]) * 4;
      const di = (row + x) * 4;
      d[di] = src[si];
      d[di + 1] = src[si + 1];
      d[di + 2] = src[si + 2];
      d[di + 3] = 255;
    }
  }
  if (Math.random() < 0.15) {
    const shiftX = 1 + Math.floor(Math.random() * 3);
    for (let y = 0; y < ch; y++) {
      const row = y * cw * 4;
      for (let x = cw - 1; x >= shiftX; x--) {
        const i = row + x * 4;
        d[i] = d[i - shiftX * 4];
      }
    }
  }
  ctx.putImageData(postData, 0, 0);
}

function loop() {
  renderFrame();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
