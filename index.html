<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eyes — VHS Horror Webcam</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  color: #0a0a0a;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  display: flex;
  align-items: center;
  justify-content: center;
}
#container {
  position: relative;
  width: 100vw;
  height: 100vh;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}
video {
  display: none;
}
#overlay {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10;
}
#startBtn {
  background: #111;
  color: #888;
  border: 1px solid #333;
  padding: 12px 32px;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  cursor: pointer;
  letter-spacing: 2px;
  text-transform: uppercase;
}
#startBtn:hover {
  background: #1a1a1a;
  color: #aaa;
  border-color: #555;
}
#status {
  color: #444;
  font-size: 11px;
  letter-spacing: 3px;
  margin-top: 8px;
  text-transform: uppercase;
}
</style>
</head>
<body>
<div id="container">
  <canvas id="mainCanvas"></canvas>
  <video id="video" autoplay playsinline></video>
  <div id="overlay">
    <button id="startBtn">▶ attiva webcam</button>
    <div id="status">SURVEILLANCE FEED // SIGNAL UNSTABLE</div>
  </div>
</div>
<script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const statusEl = document.getElementById('status');

let detector = null;
let poses = null;
let prevImageData = null;
let freezeFrames = 0;
let signalLoss = 0;
let offCanvas = document.createElement('canvas');
let offCtx = offCanvas.getContext('2d');

function sizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', sizeCanvas);
sizeCanvas();

async function startWebcam() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    video.srcObject = stream;
    await video.play();
    startBtn.style.display = 'none';
    statusEl.textContent = 'SURVEILLANCE FEED // SIGNAL UNSTABLE';
    initDetector();
  } catch (err) {
    statusEl.textContent = 'ERRORE WEBCAM // ' + err.message;
  }
}

startBtn.addEventListener('click', startWebcam);

async function initDetector() {
  try {
    detector = await ml5.poseDetection(video, 'MoveNet', { flipped: true });
    statusEl.textContent = 'SURVEILLANCE FEED // SIGNAL UNSTABLE';
    loop();
  } catch (err) {
    console.warn('ml5 not available, running without detection:', err);
    detector = null;
    loop();
  }
}

function getPoseZones() {
  if (!poses || poses.length === 0) return null;
  const keypoints = poses[0].keypoints;
  const nose = keypoints.find(k => k.name === 'nose');
  if (!nose || nose.score < 0.3) return null;

  const cx = nose.x;
  const cy = nose.y;
  const headSize = 120;
  const headHalf = headSize / 2;

  return {
    head: {
      x: cx - headHalf,
      y: cy - headHalf,
      w: headSize,
      h: headSize
    },
    nose: { x: cx, y: cy }
  };
}

function renderFrame() {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (vw === 0 || vh === 0) return;

  const cw = canvas.width;
  const ch = canvas.height;

  // Draw video to offscreen canvas at native resolution
  offCanvas.width = vw;
  offCanvas.height = vh;
  offCtx.drawImage(video, 0, 0, vw, vh);
  const imageData = offCtx.getImageData(0, 0, vw, vh);
  const data = imageData.data;

  const zones = getPoseZones();

  const tileSize = 28 + Math.floor(Math.random() * 13); // 28-40px, random per frame for unstable VHS feel

  // Convert head zone to canvas coords
  let headBox = null;
  if (zones) {
    headBox = {
      x: (zones.head.x / vw) * cw,
      y: (zones.head.y / vh) * ch,
      w: (zones.head.w / vw) * cw,
      h: (zones.head.h / vh) * ch
    };
  }

  // Clear main canvas
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cw, ch);

  // Process tile by tile
  for (let ty = 0; ty < ch; ty += tileSize) {
    for (let tx = 0; tx < cw; tx += tileSize) {
      const origX = Math.floor((tx / cw) * vw);
      const origY = Math.floor((ty / ch) * vh);
      const idx = (origY * vw + origX) * 4;
      const r = data[idx] || 0;
      const g = data[idx + 1] || 0;
      const b = data[idx + 2] || 0;

      // Determine if this tile is in the head zone
      const tileCenterX = tx + tileSize / 2;
      const tileCenterY = ty + tileSize / 2;
      const inHead = headBox &&
        tileCenterX >= headBox.x &&
        tileCenterX <= headBox.x + headBox.w &&
        tileCenterY >= headBox.y &&
        tileCenterY <= headBox.y + headBox.h;

      const gray = 0.299 * r + 0.587 * g + 0.114 * b;

      let color;
      if (inHead) {
        // Head zone: overexposed white + noise
        const noise = Math.random() < 0.6 ? 255 : 0;
        color = noise;
      } else {
        // Background/body: dark, nearly invisible
        const threshold = 30;
        if (gray > threshold && Math.random() > 0.92) {
          color = 30 + Math.floor(Math.random() * 41); // faint body hint
        } else if (Math.random() > 0.995) {
          color = 255; // occasional dead pixel
        } else {
          color = 0;
        }
      }

      const val = Math.min(255, Math.max(0, color));
      ctx.fillStyle = `rgb(${val},${val},${val})`;
      ctx.fillRect(tx, ty, tileSize, tileSize);
    }
  }
}

function applyPostFX() {
  const cw = canvas.width;
  const ch = canvas.height;
  const imageData = ctx.getImageData(0, 0, cw, ch);
  const srcData = new Uint8ClampedArray(imageData.data);
  const data = imageData.data;

  // --- CRT bulge: precomputed lookup, stretch center cols, compress edges ---
  const bulgeLUT = new Uint16Array(cw);
  for (let x = 0; x < cw; x++) {
    const nx = (x / cw) * 2 - 1;
    const distortion = 1 + 0.08 * nx * nx;
    bulgeLUT[x] = Math.max(0, Math.min(cw - 1, Math.floor((x - cw / 2) * distortion + cw / 2)));
  }
  for (let y = 0; y < ch; y++) {
    const rowOffset = y * cw;
    for (let x = 0; x < cw; x++) {
      const srcIdx = (rowOffset + bulgeLUT[x]) * 4;
      const dstIdx = (rowOffset + x) * 4;
      data[dstIdx] = srcData[srcIdx];
      data[dstIdx + 1] = srcData[srcIdx + 1];
      data[dstIdx + 2] = srcData[srcIdx + 2];
      data[dstIdx + 3] = 255;
    }
  }

  // --- Scanlines ---
  for (let y = 0; y < ch; y += 3) {
    for (let x = 0; x < cw; x++) {
      const idx = (y * cw + x) * 4;
      data[idx] = data[idx] * 0.5;
      data[idx + 1] = data[idx + 1] * 0.5;
      data[idx + 2] = data[idx + 2] * 0.5;
    }
  }

  // --- Static bands ---
  const numBands = 1 + Math.floor(Math.random() * 3);
  for (let b = 0; b < numBands; b++) {
    if (Math.random() < 0.7) {
      const bandY = Math.floor(Math.random() * ch);
      const bandH = 2 + Math.floor(Math.random() * 8);
      for (let y = bandY; y < Math.min(ch, bandY + bandH); y++) {
        for (let x = 0; x < cw; x++) {
          const idx = (y * cw + x) * 4;
          const v = Math.random() > 0.5 ? 255 : 0;
          data[idx] = v;
          data[idx + 1] = v;
          data[idx + 2] = v;
        }
      }
    }
  }

  ctx.putImageData(imageData, 0, 0);

  // --- Ghosting with micro-vibration offset ---
  if (prevImageData) {
    ctx.globalAlpha = 0.25;
    const gx = (Math.random() - 0.5) * 8;
    const gy = (Math.random() - 0.5) * 8;
    ctx.drawImage(canvas, gx, gy);
    ctx.globalAlpha = 1.0;
  }
  prevImageData = ctx.getImageData(0, 0, cw, ch);
}

function loop() {
  // --- Micro-lag: freeze for 1-2 frames every 2-5 seconds ---
  if (freezeFrames > 0) {
    freezeFrames--;
    requestAnimationFrame(loop);
    return;
  }
  if (Math.random() < 0.008) {
    freezeFrames = 1 + Math.floor(Math.random() * 2);
  }

  // --- Signal loss: full static for 200-500ms ---
  if (signalLoss > 0) {
    const cw = canvas.width;
    const ch = canvas.height;
    const imgData = ctx.createImageData(cw, ch);
    for (let i = 0; i < imgData.data.length; i += 4) {
      const v = Math.random() > 0.5 ? 255 : 0;
      imgData.data[i] = v;
      imgData.data[i + 1] = v;
      imgData.data[i + 2] = v;
      imgData.data[i + 3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
    signalLoss--;
    applyPostFX();
    requestAnimationFrame(loop);
    return;
  }
  if (Math.random() < 0.002) {
    signalLoss = 12 + Math.floor(Math.random() * 18);
  }

  // --- Normal frame ---
  if (detector) {
    detector.detect(video, (results) => {
      poses = results;
      renderFrame();
      applyPostFX();

      // --- Flickering: random brightness shift ---
      if (Math.random() < 0.05) {
        canvas.style.filter = `brightness(${0.5 + Math.random() * 1.5})`;
        setTimeout(() => { canvas.style.filter = 'brightness(1)'; }, 50 + Math.random() * 150);
      }

      statusEl.textContent = 'SURVEILLANCE FEED // SIGNAL UNSTABLE';
      requestAnimationFrame(loop);
    });
  } else {
    renderFrame();
    applyPostFX();
    if (Math.random() < 0.05) {
      canvas.style.filter = `brightness(${0.5 + Math.random() * 1.5})`;
      setTimeout(() => { canvas.style.filter = 'brightness(1)'; }, 50 + Math.random() * 150);
    }
    statusEl.textContent = 'SURVEILLANCE FEED // SIGNAL UNSTABLE';
    requestAnimationFrame(loop);
  }
}
</script>
</body>
</html>
