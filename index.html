<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eyes — VHS Horror Webcam</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  color: #0a0a0a;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  display: flex;
  align-items: center;
  justify-content: center;
}
#container {
  position: relative;
  width: 100vw;
  height: 100vh;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}
video {
  display: none;
}
#overlay {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10;
}
#startBtn {
  background: #111;
  color: #888;
  border: 1px solid #333;
  padding: 12px 32px;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  cursor: pointer;
  letter-spacing: 2px;
  text-transform: uppercase;
}
#startBtn:hover {
  background: #1a1a1a;
  color: #aaa;
  border-color: #555;
}
#status {
  color: #444;
  font-size: 11px;
  letter-spacing: 3px;
  margin-top: 8px;
  text-transform: uppercase;
}
#settingsBtn {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 20;
  background: none;
  border: 1px solid #333;
  color: #555;
  font-family: 'Courier New', monospace;
  font-size: 10px;
  padding: 6px 10px;
  cursor: pointer;
  letter-spacing: 2px;
  text-transform: uppercase;
}
#settingsBtn:hover {
  color: #aaa;
  border-color: #555;
}
#settingsPanel {
  position: fixed;
  top: 50px;
  right: 16px;
  z-index: 20;
  background: #080808;
  border: 1px solid #222;
  padding: 16px 18px;
  display: none;
  min-width: 180px;
}
#settingsPanel.visible {
  display: block;
}
.setting-row {
  margin-bottom: 12px;
}
.setting-row:last-child {
  margin-bottom: 0;
}
.setting-row label {
  display: block;
  color: #555;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.setting-row input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 2px;
  background: #222;
  outline: none;
  border: none;
}
.setting-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 10px;
  height: 10px;
  background: #555;
  cursor: pointer;
  border: none;
}
.setting-row input[type="range"]::-moz-range-thumb {
  width: 10px;
  height: 10px;
  background: #555;
  cursor: pointer;
  border: none;
}
.setting-row .value {
  color: #444;
  font-size: 9px;
  float: right;
}
</style>
</head>
<body>
<div id="container">
  <canvas id="mainCanvas"></canvas>
  <video id="video" autoplay playsinline></video>
  <div id="overlay">
    <button id="startBtn">▶ attiva webcam</button>
    <div id="status">SURVEILLANCE FEED // SIGNAL UNSTABLE</div>
  </div>
  <button id="settingsBtn">⚙</button>
  <div id="settingsPanel">
    <div class="setting-row">
      <label>CONTRASTO <span class="value" id="contrastVal">50</span></label>
      <input type="range" id="contrastSlider" min="0" max="100" value="50">
    </div>
    <div class="setting-row">
      <label>PIXEL <span class="value" id="pixelVal">50</span></label>
      <input type="range" id="pixelSlider" min="0" max="100" value="50">
    </div>
    <div class="setting-row">
      <label>NOISE <span class="value" id="noiseVal">50</span></label>
      <input type="range" id="noiseSlider" min="0" max="100" value="50">
    </div>
  </div>
</div>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const statusEl = document.getElementById('status');

let offCanvas = document.createElement('canvas');
let offCtx = offCanvas.getContext('2d');
let segmenter = null;
let glitchCanvas = document.createElement('canvas');
let glitchCtx = glitchCanvas.getContext('2d');
let maskCanvas = document.createElement('canvas');
let maskCtx = maskCanvas.getContext('2d');
let personMaskData = null;
let frameSkip = 0;
let modelLoading = false;

const settings = { contrast: 50, pixel: 50, noise: 50 };
const contrastSlider = document.getElementById('contrastSlider');
const pixelSlider = document.getElementById('pixelSlider');
const noiseSlider = document.getElementById('noiseSlider');
const contrastVal = document.getElementById('contrastVal');
const pixelVal = document.getElementById('pixelVal');
const noiseVal = document.getElementById('noiseVal');
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');

settingsBtn.addEventListener('click', () => settingsPanel.classList.toggle('visible'));

function setupSlider(slider, valEl, key) {
  slider.addEventListener('input', () => {
    settings[key] = +slider.value;
    valEl.textContent = slider.value;
  });
}
setupSlider(contrastSlider, contrastVal, 'contrast');
setupSlider(pixelSlider, pixelVal, 'pixel');
setupSlider(noiseSlider, noiseVal, 'noise');

function sizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', sizeCanvas);
sizeCanvas();

async function startWebcam() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    video.srcObject = stream;
    await video.play();
    statusEl.textContent = 'CARICAMENTO MODELLO...';
    modelLoading = true;
    try {
      segmenter = await ml5.bodySegmentation('SelfieSegmentation', {
        runtime: 'mediapipe',
        modelType: 'general'
      });
    } catch (err) {
      console.warn('ml5 bodySegmentation failed, using fallback:', err);
      segmenter = null;
    }
    modelLoading = false;
    startBtn.style.display = 'none';
    statusEl.textContent = 'SURVEILLANCE FEED // SIGNAL UNSTABLE';
    loop();
  } catch (err) {
    statusEl.textContent = 'ERRORE WEBCAM // ' + err.message;
  }
}

startBtn.addEventListener('click', startWebcam);

function macroblockRow(data, cw, ch) {
  const mbH = 4 + Math.floor(Math.random() * 8);
  const mbY = Math.floor(Math.random() * (ch - mbH));
  const mbW = Math.floor(Math.random() * (cw / 2)) + 20;
  const mbX = Math.floor(Math.random() * (cw - mbW));
  const srcY = Math.floor(Math.random() * (ch - mbH));
  for (let y = 0; y < mbH; y++) {
    const sy = (srcY + y) * cw * 4;
    const dy = (mbY + y) * cw * 4;
    for (let x = 0; x < mbW; x++) {
      const si = sy + (mbX + x) * 4;
      const di = dy + (mbX + x) * 4;
      data[di] = data[si];
      data[di + 1] = data[si + 1];
      data[di + 2] = data[si + 2];
    }
  }
}

function renderFrame() {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (vw === 0 || vh === 0) return;

  const cw = canvas.width;
  const ch = canvas.height;

  offCanvas.width = vw;
  offCanvas.height = vh;
  offCtx.drawImage(video, 0, 0, vw, vh);
  const imageData = offCtx.getImageData(0, 0, vw, vh);
  const data = imageData.data;

  const pixelAmount = settings.pixel / 100;
  const tileW = Math.max(2, Math.round(2 + pixelAmount * 14));
  const tileH = Math.max(1, Math.round(1 + pixelAmount * 6));
  const contrastNorm = (settings.contrast / 100) * 3;
  const noiseChance = (settings.noise / 100) * 0.15;
  const decompose = (1 - pixelAmount) * 0.5 + 0.2;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cw, ch);

  for (let ty = 0; ty < ch; ty += tileH) {
    for (let tx = 0; tx < cw; tx += tileW) {
      if (Math.random() < decompose) continue;

      const driftX = Math.floor((Math.random() - 0.5) * tileW * 4);
      const driftY = Math.floor((Math.random() - 0.5) * tileH * 2);

      const sx = Math.max(0, Math.min(vw - 1, Math.floor(((tx + driftX) / cw) * vw)));
      const sy = Math.max(0, Math.min(vh - 1, Math.floor(((ty + driftY) / ch) * vh)));
      const idx = (sy * vw + sx) * 4;
      const r = data[idx] || 0;
      const g = data[idx + 1] || 0;
      const b = data[idx + 2] || 0;

      let gray = 0.299 * r + 0.587 * g + 0.114 * b;
      gray = Math.round((gray - 128) * contrastNorm + 128);
      gray = Math.min(255, Math.max(0, gray));
      gray = gray > 128 ? 0 : 255;

      if (Math.random() < noiseChance) gray = Math.random() > 0.5 ? 255 : 0;

      ctx.fillStyle = `rgb(${gray},${gray},${gray})`;
      ctx.fillRect(tx, ty, tileW, tileH);
    }
  }

  if (Math.random() < 0.12) macroblockRow(ctx.getImageData(0, 0, cw, ch).data, cw, ch);
}

function renderGlitchFrame() {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (vw === 0 || vh === 0) return;

  const cw = glitchCanvas.width;
  const ch = glitchCanvas.height;

  offCanvas.width = vw;
  offCanvas.height = vh;
  offCtx.drawImage(video, 0, 0, vw, vh);
  const imageData = offCtx.getImageData(0, 0, vw, vh);
  const data = imageData.data;

  const pixelAmount = settings.pixel / 100;
  const tileW = Math.max(2, Math.round(2 + pixelAmount * 14));
  const tileH = Math.max(1, Math.round(1 + pixelAmount * 6));
  const contrastNorm = (settings.contrast / 100) * 3;
  const noiseChance = (settings.noise / 100) * 0.15;
  const decompose = (1 - pixelAmount) * 0.5 + 0.2;

  glitchCtx.fillStyle = '#000';
  glitchCtx.fillRect(0, 0, cw, ch);

  for (let ty = 0; ty < ch; ty += tileH) {
    for (let tx = 0; tx < cw; tx += tileW) {
      if (Math.random() < decompose) continue;

      const driftX = Math.floor((Math.random() - 0.5) * tileW * 4);
      const driftY = Math.floor((Math.random() - 0.5) * tileH * 2);

      const sx = Math.max(0, Math.min(vw - 1, Math.floor(((tx + driftX) / cw) * vw)));
      const sy = Math.max(0, Math.min(vh - 1, Math.floor(((ty + driftY) / ch) * vh)));
      const idx = (sy * vw + sx) * 4;
      const r = data[idx] || 0;
      const g = data[idx + 1] || 0;
      const b = data[idx + 2] || 0;

      let gray = 0.299 * r + 0.587 * g + 0.114 * b;
      gray = Math.round((gray - 128) * contrastNorm + 128);
      gray = Math.min(255, Math.max(0, gray));
      gray = gray > 128 ? 0 : 255;

      if (Math.random() < noiseChance) gray = Math.random() > 0.5 ? 255 : 0;

      glitchCtx.fillStyle = `rgb(${gray},${gray},${gray})`;
      glitchCtx.fillRect(tx, ty, tileW, tileH);
    }
  }
}

async function getPersonMask() {
  if (!segmenter) return null;
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (vw === 0 || vh === 0) return null;

  try {
    const results = await segmenter.segment(video);
    if (!results || results.length === 0) return null;
    const rawMask = results[0].mask;
    if (!rawMask) return null;

    const cw = canvas.width;
    const ch = canvas.height;
    maskCanvas.width = cw;
    maskCanvas.height = ch;

    // Handle different mask formats from ml5.js
    let maskSource;
    if (rawMask instanceof ImageData) {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = rawMask.width;
      tempCanvas.height = rawMask.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.putImageData(rawMask, 0, 0);
      maskSource = tempCanvas;
    } else {
      maskSource = rawMask;
    }

    const maskW = rawMask.width || rawMask.videoWidth || vw;
    const maskH = rawMask.height || rawMask.videoHeight || vh;
    maskCtx.drawImage(maskSource, 0, 0, maskW, maskH, 0, 0, cw, ch);

    // Threshold to binary (white = person, black = bg)
    const maskData = maskCtx.getImageData(0, 0, cw, ch);
    const d = maskData.data;
    for (let i = 0; i < d.length; i += 4) {
      const val = d[i] > 128 ? 255 : 0;
      d[i] = val;
      d[i + 1] = val;
      d[i + 2] = val;
      d[i + 3] = 255;
    }
    maskCtx.putImageData(maskData, 0, 0);
    return maskData;
  } catch (err) {
    console.warn('segment() failed:', err);
    return null;
  }
}

function compositePersonGlitch() {
  const cw = canvas.width;
  const ch = canvas.height;

  // Draw clean video as background on main canvas
  offCanvas.width = cw;
  offCanvas.height = ch;
  offCtx.drawImage(video, 0, 0, cw, ch);
  ctx.drawImage(offCanvas, 0, 0);

  // Restore binary mask onto maskCanvas (in case it was modified)
  if (personMaskData) {
    maskCtx.putImageData(personMaskData, 0, 0);
  }

  // Clip glitch canvas through the mask
  maskCtx.globalCompositeOperation = 'source-in';
  maskCtx.drawImage(glitchCanvas, 0, 0);
  maskCtx.globalCompositeOperation = 'source-over';

  // Overlay glitched person pixels on main canvas
  ctx.drawImage(maskCanvas, 0, 0);
}

function applyPostFX() {
  const cw = canvas.width;
  const ch = canvas.height;
  const imageData = ctx.getImageData(0, 0, cw, ch);
  const srcData = new Uint8ClampedArray(imageData.data);
  const data = imageData.data;

  // --- CRT bulge ---
  const bulgeLUT = new Uint16Array(cw);
  for (let x = 0; x < cw; x++) {
    const nx = (x / cw) * 2 - 1;
    const distortion = 1 + 0.12 * nx * nx;
    bulgeLUT[x] = Math.max(0, Math.min(cw - 1, Math.floor((x - cw / 2) * distortion + cw / 2)));
  }
  for (let y = 0; y < ch; y++) {
    const rowOffset = y * cw;
    for (let x = 0; x < cw; x++) {
      const srcIdx = (rowOffset + bulgeLUT[x]) * 4;
      const dstIdx = (rowOffset + x) * 4;
      data[dstIdx] = srcData[srcIdx];
      data[dstIdx + 1] = srcData[srcIdx + 1];
      data[dstIdx + 2] = srcData[srcIdx + 2];
      data[dstIdx + 3] = 255;
    }
  }

  // --- Chromatic shift on edges (subtle color fringe) ---
  if (Math.random() < 0.15) {
    const shiftX = 1 + Math.floor(Math.random() * 3);
    for (let y = 0; y < ch; y++) {
      const row = y * cw * 4;
      for (let x = cw - 1; x >= shiftX; x--) {
        const i = row + x * 4;
        data[i] = data[i - shiftX * 4];
      }
    }
  }

  ctx.putImageData(imageData, 0, 0);
}

function loop() {
  renderFrame();
  applyPostFX();

  statusEl.textContent = 'SURVEILLANCE FEED // SIGNAL UNSTABLE';
  requestAnimationFrame(loop);
}
</script>
<script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
</body>
</html>
