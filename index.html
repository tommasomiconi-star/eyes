<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eyes — VHS Horror Webcam</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  color: #0a0a0a;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  display: flex;
  align-items: center;
  justify-content: center;
}
#container {
  position: relative;
  width: 100vw;
  height: 100vh;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}
video {
  display: none;
}
#overlay {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10;
}
#startBtn {
  background: #111;
  color: #888;
  border: 1px solid #333;
  padding: 12px 32px;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  cursor: pointer;
  letter-spacing: 2px;
  text-transform: uppercase;
}
#startBtn:hover {
  background: #1a1a1a;
  color: #aaa;
  border-color: #555;
}
#status {
  color: #444;
  font-size: 11px;
  letter-spacing: 3px;
  margin-top: 8px;
  text-transform: uppercase;
}
</style>
</head>
<body>
<div id="container">
  <canvas id="mainCanvas"></canvas>
  <video id="video" autoplay playsinline></video>
  <div id="overlay">
    <button id="startBtn">▶ attiva webcam</button>
    <div id="status">SURVEILLANCE FEED // SIGNAL UNSTABLE</div>
  </div>
</div>
<script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const statusEl = document.getElementById('status');

let detector = null;
let poses = null;
let prevImageData = null;
let glitchCounter = 0;
let freezeFrames = 0;
let signalLoss = 0;

function sizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', sizeCanvas);
sizeCanvas();

async function startWebcam() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    video.srcObject = stream;
    await video.play();
    startBtn.style.display = 'none';
    statusEl.textContent = 'SURVEILLANCE FEED // SIGNAL UNSTABLE';
    initDetector();
  } catch (err) {
    statusEl.textContent = 'ERRORE WEBCAM // ' + err.message;
  }
}

startBtn.addEventListener('click', startWebcam);

async function initDetector() {
  try {
    detector = await ml5.poseDetection(video, 'MoveNet', { flipped: true });
    statusEl.textContent = 'SURVEILLANCE FEED // SIGNAL UNSTABLE';
    loop();
  } catch (err) {
    console.warn('ml5 not available, running without detection:', err);
    detector = null;
    loop();
  }
}

function getPoseZones() {
  if (!poses || poses.length === 0) return null;
  const keypoints = poses[0].keypoints;
  const nose = keypoints.find(k => k.name === 'nose');
  const leftEye = keypoints.find(k => k.name === 'left_eye');
  const rightEye = keypoints.find(k => k.name === 'right_eye');
  if (!nose || nose.score < 0.3) return null;

  const cx = nose.x;
  const cy = nose.y;
  const headSize = 120;
  const headHalf = headSize / 2;

  return {
    head: {
      x: cx - headHalf,
      y: cy - headHalf,
      w: headSize,
      h: headSize
    },
    nose: { x: cx, y: cy }
  };
}
</script>
</body>
</html>
