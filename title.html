<script>
  const eyeImages = ['asset/occhio_nero.png', 'asset/occhio_luminoso.png'];
  const numEyes = Math.floor(Math.random() * 6) + 12; // 12-18 occhi
  const minSize = 120;
  const maxSize = 300;
  const minDistance = 40; // margine extra tra occhi

  const eyes = [];

  // Titolo come ostacolo con margine extra
  const titleZone = { x: 20, y: 20, width: 1000, height: 400, margin: 60 };

  for (let i = 0; i < numEyes; i++) {
    let attempts = 0;
    let placed = false;

    while (!placed && attempts < 100) {
      const size = Math.floor(Math.random() * (maxSize - minSize + 1)) + minSize;
      const maxX = window.innerWidth - size - 40;
      const maxY = window.innerHeight - size - 40;
      let x = Math.floor(Math.random() * (maxX - 20)) + 20;
      let y = Math.floor(Math.random() * (maxY - 20)) + 20;

      let overlapping = false;

      // Controlla collisione con titolo
      const t = titleZone;
      const distXt = Math.abs((x + size/2) - (t.x + t.width/2));
      const distYt = Math.abs((y + size/2) - (t.y + t.height/2));
      const minXt = (size + t.width)/2 + t.margin;
      const minYt = (size + t.height)/2 + t.margin;
      if (distXt < minXt && distYt < minYt) {
        overlapping = true;
      }

      // Controlla collisione con altri occhi
      if (!overlapping) {
        for (const eye of eyes) {
          const distX = Math.abs((x + size/2) - (eye.x + eye.width/2));
          const distY = Math.abs((y + size/2) - (eye.y + eye.height/2));
          const minX = (size + eye.width)/2 + minDistance;
          const minY = (size + eye.height)/2 + minDistance;

          if (distX < minX && distY < minY) {
            overlapping = true;
            break;
          }
        }
      }

      if (!overlapping) {
        const img = document.createElement('img');
        img.src = eyeImages[Math.floor(Math.random() * eyeImages.length)];
        img.className = 'eye';
        img.style.width = size + 'px';
        img.style.height = 'auto';
        img.style.left = x + 'px';
        img.style.top = y + 'px';
        document.body.appendChild(img);

        // Velocità casuale: tra 2 e 6 pixel per frame
        const speed = 2 + Math.random() * 4;
        const angle = Math.random() * Math.PI * 2;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;

        eyes.push({
          el: img,
          x, y,
          width: size, height: size,
          vx, vy
        });

        placed = true;
      }

      attempts++;
    }
  }

  function animate() {
    const W = window.innerWidth;
    const H = window.innerHeight;

    for (const eye of eyes) {
      eye.x += eye.vx;
      eye.y += eye.vy;

      // Rimbalzo / bounce ai bordi
      if (eye.x <= 0) {
        eye.x = 0;
        eye.vx = Math.abs(eye.vx);
      }
      if (eye.x + eye.width >= W) {
        eye.x = W - eye.width;
        eye.vx = -Math.abs(eye.vx);
      }
      if (eye.y <= 0) {
        eye.y = 0;
        eye.vy = Math.abs(eye.vy);
      }
      if (eye.y + eye.height >= H) {
        eye.y = H - eye.height;
        eye.vy = -Math.abs(eye.vy);
      }

      eye.el.style.left = eye.x + 'px';
      eye.el.style.top = eye.y + 'px';
    }

    requestAnimationFrame(animate);
  }

  animate();
</script>
